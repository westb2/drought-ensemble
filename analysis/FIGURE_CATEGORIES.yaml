# Figure category membership for analysis/figures/
#
# "final" = selected for a condensed story deck (not fidelity).
# "exploratory" = everything else worth keeping.
#
# Only list overrides / finals here. Unlisted basenames are classified by
# analysis/figure_paths.py inference (prefix + extension rules).
#
# pumping_final = pumping-only story (catalog 1e-7/1e-6/1e-5; never matched).
# comparison = drought vs domain-matched pumping (3 condensed figures).
# Do not list drought_final's story_pumping_* names under pumping_final —
# those stay in the drought deck.

